.veil{position:fixed;inset:0;z-index:0;
  background:radial-gradient(62% 58% at 50% 40%, rgba(40,15,0,.42), rgba(40,15,0,.12) 72%, transparent)}
.card{
  position:relative;z-index:2;background:var(--branco);border-radius:var(--raio);
  box-shadow:var(--sombra);width:100%;max-width:440px;padding:32px 28px 26px;
  animation:rise .5s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card .logo{height:56px;margin:0 auto 14px;display:block}
.card h1{font-size:19px;font-weight:800;line-height:1.25;text-align:center}
.card .sub{color:var(--tinta-suave);font-size:13px;margin-top:6px;margin-bottom:22px;text-align:center}

.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--tinta-suave);margin-bottom:6px}
.field .req{color:var(--laranja-base)}
.field input,.field select{
  width:100%;font:inherit;font-size:15px;padding:12px 14px;border:1px solid var(--linha);
  border-radius:12px;background:#FBF9F7;color:var(--tinta);transition:border-color .15s,box-shadow .15s;
}
.field select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#5A5A66 50%),linear-gradient(135deg,#5A5A66 50%,transparent 50%);background-position:calc(100% - 18px) center,calc(100% - 13px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}
.field input:focus,.field select:focus{outline:none;border-color:var(--laranja-forte);box-shadow:0 0 0 3px rgba(234,122,30,.18);background:#fff}
.field input.invalid,.field select.invalid{border-color:#D64541;background:#fff}

.btn-enviar{
  width:100%;font:inherit;font-size:16px;font-weight:800;color:#fff;cursor:pointer;
  background:linear-gradient(120deg,var(--laranja-forte),var(--laranja-base));
  border:none;border-radius:999px;padding:14px 18px;margin-top:8px;
  box-shadow:0 10px 24px rgba(232,98,14,.35);transition:transform .12s,box-shadow .12s;
}
.btn-enviar:hover{transform:translateY(-1px)}
.btn-enviar[disabled]{opacity:.7;cursor:default;transform:none}

.voltar{display:inline-block;margin-top:16px;font-size:13px;color:var(--tinta-suave);text-decoration:none;border-bottom:1px solid transparent}
.voltar:hover{color:var(--laranja-base);border-color:var(--laranja-base)}
.center{text-align:center}

.msg{display:none;margin-top:16px;font-size:13px;border-radius:10px;padding:11px 13px;text-align:left}
.msg.show{display:block}
.msg.erro{color:#8A2A27;background:var(--vermelho-bg);border:1px solid #F3C9C6}
.msg.ok{color:#1E6B4E;background:#E7F5EF;border:1px solid #BFE6D5}

@media(max-width:560px){ body{padding:18px 14px} .card{padding:26px 20px 22px} }
</style></head><body>

  <div class="msg" id="msg"></div>

  <div class="center">
    <a class="voltar" href="login.html">← Voltar ao login</a>
  </div>
</main>

<script>
var API_URL = 'https://script.google.com/a/macros/natura.net/s/AKfycbxN8AS4Q2aTqhtd7I6Q8TceWAdFDZDyzWmVb0tn833wTFZAKrIDVha-h2E9n0AE8P0wiA/exec';

var form = document.getElementById('form');
var btn = document.getElementById('btnEnviar');
var msg = document.getElementById('msg');

var CAMPOS = ['nomeCompleto','emailNatura','telefone','codigoSetor','tipoAcesso','nomeSetor','gv','mercado'];
var LABELS = {
  nomeCompleto:'Nome completo', emailNatura:'E-mail Natura', telefone:'Telefone',
  codigoSetor:'Código do setor', tipoAcesso:'Tipo de acesso', nomeSetor:'Nome do setor',
  gv:'Gerência de Vendas (GV)', mercado:'Mercado'
};

function mostrarMsg(texto, tipo){ msg.textContent = texto; msg.className = 'msg show ' + (tipo||''); }
function limparMsg(){ msg.className = 'msg'; msg.textContent = ''; }
function emailValido(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

form.addEventListener('submit', function(e){
  e.preventDefault();
  limparMsg();

  // Validação de obrigatórios no front.
  var dados = {};
  var faltando = [];
  CAMPOS.forEach(function(c){
    var el = document.getElementById(c);
    var v = (el.value || '').trim();
    el.classList.remove('invalid');
    if (!v){ faltando.push(LABELS[c]); el.classList.add('invalid'); }
    dados[c] = v;
  });

  if (faltando.length){
    mostrarMsg('Preencha os campos obrigatórios: ' + faltando.join(', '), 'erro');
    return;
  }
  if (!emailValido(dados.emailNatura)){
    document.getElementById('emailNatura').classList.add('invalid');
    mostrarMsg('E-mail Natura inválido.', 'erro');
    return;
  }

  dados.acao = 'solicitar';
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  // POST com text/plain evita preflight de CORS do Apps Script; o Script lê o corpo como JSON.
  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(dados)
  })
    .then(function(r){ return r.json(); })
    .then(function(resp){
      if (resp && resp.sucesso){
        mostrarMsg('Solicitação enviada com sucesso. Você será avisado quando o acesso for liberado.', 'ok');
        btn.textContent = 'Solicitação enviada';
        // mantém desabilitado para evitar reenvio duplicado
      } else {
        mostrarMsg((resp && resp.erro) ? resp.erro : 'Não foi possível enviar. Tente novamente.', 'erro');
        btn.disabled = false;
        btn.textContent = 'Enviar solicitação';
      }
    })
    .catch(function(){
      mostrarMsg('Falha de conexão. Verifique sua internet e tente novamente.', 'erro');
      btn.disabled = false;
      btn.textContent = 'Enviar solicitação';
    });
});
</script>
</body></html>
